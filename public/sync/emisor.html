<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sincronización · Emisor</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 24px;
            background: #101827;
            color: #ffffff;
        }

        button {
            padding: 16px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #codigo {
            font-size: 48px;
            letter-spacing: 6px;
            color: #80e3f2;
        }

        #mensaje {
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <h1>Crear una sesión</h1>
    <button id="cerrarAcceso" type="button">Cerrar sesión</button>
    <p id="estadoCierre" role="status" aria-live="polite"></p>

    <p>
        Esta página representará al visor.
        Crea una sesión y escribe su código en la computadora receptora.
    </p>

    <button id="crear" type="button">Crear sesión</button>

    <p id="mensaje" role="status" aria-live="polite">
        Todavía no has creado una sesión.
    </p>

    <section id="resultado" hidden>
        <h2>Código de vinculación</h2>
        <p id="codigo"></p>
        <p>Tienes 10 minutos desde su creación para vincular la computadora.</p>
    </section>
    <button id="enviar" type="button" disabled>
        Enviar evento de prueba
    </button>
    <p id="estadoEnvio" role="status" aria-live="polite"></p>

    <script src="./control-acceso.js"></script>
    <script>
        const botonCrear = document.getElementById('crear');
        const mensaje = document.getElementById('mensaje');
        const resultado = document.getElementById('resultado');
        const codigo = document.getElementById('codigo');

        // La sesión se mantiene en memoria y se recupera desde sessionStorage.
        let sesion = null;
        const CLAVE_SESION_EMISORA = 'iastronaut_sync_emisor';
        const CLAVE_ENVIO_PENDIENTE = 'iastronaut_sync_envio_pendiente';
        const botonEnviar = document.getElementById('enviar');
        const estadoEnvio = document.getElementById('estadoEnvio');

        let clavePendiente = null;
        function generarClaveEvento() {
            const bytes = crypto.getRandomValues(new Uint8Array(16));

            return Array.from(
                bytes,
                valor => valor.toString(16).padStart(2, '0')
            ).join('');
        }

        botonEnviar.addEventListener('click', async () => {
            if (!sesion || sesion.estado !== 'vinculada') return;

            botonEnviar.disabled = true;
            estadoEnvio.textContent = 'Enviando evento…';

            // Si falló una petición anterior, conservamos su misma clave.
            clavePendiente ??= generarClaveEvento();

            try {
                sessionStorage.setItem(
                    CLAVE_ENVIO_PENDIENTE,
                    JSON.stringify({
                        sesion_id: sesion.sesion_id,
                        clave_evento: clavePendiente
                    })
                );
            } catch (error) {
                if (error.codigo === 'ACCESO_REQUERIDO' || ControlAcceso.terminado) return;
                estadoEnvio.textContent =
                    'No se pudo guardar el envío pendiente. No se enviará para evitar perder su seguimiento.';

                botonEnviar.disabled = false;
                return;
            }

            try {
                const respuesta = await ControlAcceso.solicitar('../api/sync/enviar-evento.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: 'Bearer ' + sesion.token_emisor
                    },
                    body: JSON.stringify({
                        clave_evento: clavePendiente
                    }),
                    cache: 'no-store',
                    signal: AbortSignal.timeout(8000)
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(datos.error || 'No se pudo enviar el evento.');
                }

                if (
                    !Number.isInteger(datos.evento_id) ||
                    datos.clave_evento !== clavePendiente
                ) {
                    throw new Error('Respuesta del servidor no válida.');
                }

                estadoEnvio.textContent =
                    'Evento ' + datos.evento_id +
                    (datos.ya_existia
                    ? ': el servidor ya lo había registrado.'
                    : ': guardado correctamente en el servidor.');

                sessionStorage.removeItem(CLAVE_ENVIO_PENDIENTE);
                clavePendiente = null;
                botonEnviar.textContent = 'Enviar otro evento de prueba';
            } catch (error) {
                if (error.codigo === 'ACCESO_REQUERIDO' || ControlAcceso.terminado) return;
                estadoEnvio.textContent =
                    error.message +
                    ' Puedes reintentar; se conservará la clave del evento.';

                botonEnviar.textContent = 'Reintentar envío';
            } finally {
                botonEnviar.disabled = ControlAcceso.terminado;
            }
        });

        async function consultarEstado() {
    if (!sesion || ControlAcceso.terminado) return;

    let volverAConsultar = true;

    try {
        const respuesta = await ControlAcceso.solicitar('../api/sync/estado-sesion.php', {
            method: 'GET',
            headers: {
                Authorization: 'Bearer ' + sesion.token_emisor
            },
            cache: 'no-store',
            signal: AbortSignal.timeout(8000)
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            if ([401, 410].includes(respuesta.status)) {
                volverAConsultar = false;
                codigo.textContent = '';
                resultado.hidden = true;
                try {
                    sessionStorage.removeItem(CLAVE_SESION_EMISORA);
                } catch (_) {
                    // No interrumpe el manejo del error.
                }

                sesion = null;
                botonEnviar.disabled = true;
            }

            throw new Error(
                datos.error || 'No se pudo consultar el estado.'
            );
        }

        sesion.estado = datos.estado;

        if (sesion.estado === 'vinculada') {
            botonEnviar.disabled = false;
            recuperarEnvioPendiente();
            mensaje.textContent =
                'Computadora vinculada. La sesión está lista para enviar eventos.';

            volverAConsultar = false;
        } else {
            mensaje.textContent =
                'Esperando que la computadora introduzca el código…';
        }
    } catch (error) {
                if (error.codigo === 'ACCESO_REQUERIDO' || ControlAcceso.terminado) return;
        mensaje.textContent = volverAConsultar
            ? 'No se pudo consultar el estado. Reintentando…'
            : error.message + ' Recarga esta página para comenzar de nuevo.';
    }

    if (volverAConsultar) {
        setTimeout(consultarEstado, 2000);
    }
}

        botonCrear.addEventListener('click', async () => {
            botonCrear.disabled = true;
            mensaje.textContent = 'Creando sesión…';

            try {
                const respuesta = await ControlAcceso.solicitar('../api/sync/crear-sesion.php', {
                    method: 'POST',
                    cache: 'no-store'
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(
                        datos.error || 'No se pudo crear la sesión.'
                    );
                }

                if (
                    typeof datos.codigo !== 'string' ||
                    typeof datos.token_emisor !== 'string' ||
                    !Number.isInteger(datos.sesion_id)
                ) {
                    throw new Error('El servidor devolvió una respuesta incompleta.');
                }

                sesion = datos;

                try {
                    sessionStorage.setItem(
                        CLAVE_SESION_EMISORA,
                        JSON.stringify(sesion)
                    );
                } catch (error) {
                if (error.codigo === 'ACCESO_REQUERIDO' || ControlAcceso.terminado) return;
                    console.warn('No se pudo guardar la sesión para recuperarla al recargar.');
                }

                codigo.textContent = sesion.codigo;
                resultado.hidden = false;

                mensaje.textContent =
                    'Sesión creada. Falta vincular la computadora receptora.';

                botonCrear.textContent = 'Sesión creada';
                consultarEstado();
            } catch (error) {
                if (error.codigo === 'ACCESO_REQUERIDO' || ControlAcceso.terminado) return;
                mensaje.textContent = 'Error: ' + error.message;
                botonCrear.disabled = false;
            }
        });
        function recuperarSesionEmisora() {
            let guardada;

            try {
                const texto = sessionStorage.getItem(CLAVE_SESION_EMISORA);

                if (!texto) return;

                guardada = JSON.parse(texto);

                if (
                    !guardada ||
                    !Number.isInteger(guardada.sesion_id) ||
                    guardada.sesion_id < 1 ||
                    typeof guardada.codigo !== 'string' ||
                    !/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(guardada.codigo) ||
                    typeof guardada.token_emisor !== 'string' ||
                    !/^[a-f0-9]{64}$/.test(guardada.token_emisor)
                ) {
                    throw new Error('La sesión guardada no tiene un formato válido.');
                }
            } catch (error) {
                if (error.codigo === 'ACCESO_REQUERIDO' || ControlAcceso.terminado) return;
                try {
                    sessionStorage.removeItem(CLAVE_SESION_EMISORA);
                } catch (_) {
                    // El almacenamiento puede no estar disponible.
                }

                mensaje.textContent =
                    'No se pudo recuperar la sesión. Puedes crear una nueva.';

                return;
            }

            sesion = guardada;

            // No confiamos en el estado almacenado: lo consultaremos al servidor.
            sesion.estado = 'verificando';

            codigo.textContent = sesion.codigo;
            resultado.hidden = false;

            botonCrear.disabled = true;
            botonCrear.textContent = 'Sesión recuperada';
            botonEnviar.disabled = true;

            mensaje.textContent = 'Verificando la sesión guardada…';

            consultarEstado();
        }
    function recuperarEnvioPendiente() {
        clavePendiente = null;

        try {
            const texto = sessionStorage.getItem(CLAVE_ENVIO_PENDIENTE);

            if (!texto) return;

            const pendiente = JSON.parse(texto);

            if (
                !pendiente ||
                pendiente.sesion_id !== sesion.sesion_id ||
                typeof pendiente.clave_evento !== 'string' ||
                !/^[a-f0-9]{32}$/.test(pendiente.clave_evento)
            ) {
                sessionStorage.removeItem(CLAVE_ENVIO_PENDIENTE);
                return;
            }

            clavePendiente = pendiente.clave_evento;

            botonEnviar.textContent = 'Reintentar envío pendiente';
            estadoEnvio.textContent =
                'Se recuperó un envío sin respuesta confirmada. Puedes reintentarlo.';
        } catch (error) {
                if (error.codigo === 'ACCESO_REQUERIDO' || ControlAcceso.terminado) return;
            // Detenemos el envío para no generar otra clave a ciegas.
            botonEnviar.disabled = true;
            estadoEnvio.textContent =
                'No se pudo recuperar el envío pendiente. Revisa el almacenamiento antes de continuar.';
        }
    }
        document.getElementById('cerrarAcceso').addEventListener('click', ControlAcceso.cerrar);
        ControlAcceso.iniciar(recuperarSesionEmisora);
    </script>
</body>
</html>
